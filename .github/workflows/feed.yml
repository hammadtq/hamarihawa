# Rebuilds the fire feed from NASA FIRMS and stores it in Cloudflare KV.
# The run exits early (no KV writes) when NASA's files haven't changed.
name: Fire feed

on:
  schedule:
    # Off-peak minutes: GitHub delays or drops jobs scheduled on the hour and quarter-hours.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Upload even if NASA's files are unchanged"
        type: boolean
        default: false
      all_days:
        description: "Rewrite every full day in the 7-day window (after a coverage change)"
        type: boolean
        default: false

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and upload feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: 80f0abe06205411bb5d4feb087c165f6
          FIRMS_BASE: https://hamarihawa.hammadtariq.workers.dev/api/firms
        run: python3 -I scripts/build-feed.py --out feed --upload ${{ inputs.force && '--force' || '' }} ${{ inputs.all_days && '--all-days' || '' }}
