# Rebuilds the 14-day NO2 (traffic & industry) layer once a day and stores it in Cloudflare KV.
name: NO2 layer

on:
  schedule:
    - cron: "43 4 * * *"  # after the previous day's TROPOMI orbits are processed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 numpy==2.1.3
      - name: Build and upload NO2 layer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: 80f0abe06205411bb5d4feb087c165f6
        run: python3 -I scripts/build-no2.py --out no2 --upload
