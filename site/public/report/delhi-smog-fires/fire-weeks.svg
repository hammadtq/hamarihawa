<rect x="216" y="340" width="10" height="10" fill="#c9c9c4"/><text x="231" y="349" font-size="10" fill="#3a3935">December–January days of the same season with similar ventilation</text>
<text x="46" y="372" font-size="9" fill="#7c7c80">Matched on one measure only (mixing height × wind speed). The gap between the bars is not the amount caused by fires:</text>
<text x="46" y="384" font-size="9" fill="#7c7c80">temperature, humidity, fireworks and the mix of sources also differ between these weeks and midwinter. HamariHawa.</text></svg>