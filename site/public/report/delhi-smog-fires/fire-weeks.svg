<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Delhi PM2.5 on peak fire-week days and on ventilation-matched winter days, by upstream fire-detection category">
