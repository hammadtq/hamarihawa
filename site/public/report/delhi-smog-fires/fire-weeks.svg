<text x="596.0" y="305" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d1d1b">Many detections near the path</text><text x="596.0" y="319" font-size="9.5" text-anchor="middle" fill="#7c7c80">30 days</text>
