<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" font-family="'Noto Naskh Arabic', 'Geeza Pro', Tahoma, Arial, sans-serif" role="img" aria-label="⁧آگ کے عروج کے ہفتوں اور ہوا کی نکاسی میں ملتے جلتے سردیوں کے دنوں میں دہلی کا PM2.5، آگ کے مقامات کے گروپ کے لحاظ سے⁩">
<rect width="100%" height="100%" fill="#fff"/>
<text x="46" y="18" font-size="14" font-weight="700" fill="#1d1d1b">⁧آگ والے ہفتوں کے دن اور ملتی جلتی ہوا کی نکاسی والے سردیوں کے دن: دہلی کا PM2.5، µg/m³⁩</text>
<text x="46" y="33" font-size="10.5" fill="#7c7c80">⁧57 دنوں (25 اکتوبر–20 نومبر) اور ان کے جوڑ کے دسمبر–جنوری کے دنوں کی اوسط، اشاریے کے گروپ کے لحاظ سے⁩</text>
<line x1="46" x2="706" y1="218.8" y2="218.8" stroke="#eee"/><text x="40" y="221.8" font-size="9.5" text-anchor="end" fill="#7c7c80">100</text>
<line x1="46" x2="706" y1="147.5" y2="147.5" stroke="#eee"/><text x="40" y="150.5" font-size="9.5" text-anchor="end" fill="#7c7c80">200</text>
<line x1="46" x2="706" y1="76.2" y2="76.2" stroke="#eee"/><text x="40" y="79.2" font-size="9.5" text-anchor="end" fill="#7c7c80">300</text>
