<text x="596.0" y="305" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d1d1b">⁧راستے کے قریب زیادہ مقامات⁩</text><text x="596.0" y="319" font-size="9.5" text-anchor="middle" fill="#7c7c80">⁧30 دن⁩</text>
<rect x="46" y="340" width="10" height="10" fill="#d62d20"/><text x="61" y="349" font-size="10" fill="#3a3935">⁧25 اکتوبر–20 نومبر کے دن⁩</text>
<rect x="216" y="340" width="10" height="10" fill="#c9c9c4"/><text x="231" y="349" font-size="10" fill="#3a3935">⁧اسی موسم کے دسمبر–جنوری کے دن جن میں ہوا کی نکاسی ملتی جلتی تھی⁩</text>
<text x="46" y="372" font-size="9" fill="#7c7c80">⁧صرف ایک پیمانے (مکسنگ ہائٹ × ہوا کی رفتار) پر ملایا گیا ہے۔ دونوں بار کا فرق وہ مقدار نہیں جو آگ کی وجہ سے ہے:⁩</text>
<text x="46" y="384" font-size="9" fill="#7c7c80">⁧درجۂ حرارت، نمی، آتش بازی اور آلودگی کے ذرائع بھی ان ہفتوں اور سردیوں کے وسط میں مختلف ہوتے ہیں۔ ہماری ہوا۔⁩</text></svg>