<text x="46" y="380" font-size="9" fill="#7c7c80">Detections are not fires, burnt area or emissions. The satellites sample fires at particular times of day; burning has moved later</text>
<text x="46" y="392" font-size="9" fill="#7c7c80">and orbits have drifted, so the years are not sampled alike. A fall in detections does not imply an equal fall in burnt area or emissions.</text>
<text x="46" y="404" font-size="9" fill="#7c7c80">*2026: to 10 November. Under each year: November days with a Delhi value; an average is shown only with 15 or more. HamariHawa.</text></svg>