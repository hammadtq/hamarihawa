<text x="46" y="380" font-size="9" fill="#7c7c80">⁧یہ مقامات نہ آگ کی تعداد ہیں، نہ جلا ہوا رقبہ، نہ اخراج۔ سیٹلائٹ دن کے مخصوص اوقات میں ہی آگ دیکھتے ہیں؛ جلانے کا وقت آگے سرک گیا ہے⁩</text>
<text x="46" y="392" font-size="9" fill="#7c7c80">⁧اور مدار سرک گئے ہیں، اس لیے ہر سال ایک جیسا مشاہدہ نہیں ہوا۔ مقامات میں کمی کا مطلب جلے ہوئے رقبے یا اخراج میں اتنی ہی کمی نہیں۔⁩</text>
<text x="46" y="404" font-size="9" fill="#7c7c80">⁧*2026: 10 نومبر تک۔ ہر سال کے نیچے: نومبر کے وہ دن جن کا دہلی کا عدد موجود ہے؛ اوسط صرف 15 یا زیادہ دنوں پر دکھائی گئی ہے۔ ہماری ہوا۔⁩</text></svg>