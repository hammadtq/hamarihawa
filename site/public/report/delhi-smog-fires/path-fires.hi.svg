<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', Mangal, Nirmala UI, Arial, sans-serif" role="img" aria-label="सीज़न के हर हिस्से में, हवा के रास्ते में आग के निशानों के समूह के हिसाब से दिल्ली का PM2.5">
