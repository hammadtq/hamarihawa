<rect x="446" y="338" width="10" height="10" fill="#d62d20" rx="2"/><text x="461" y="347" font-size="10" fill="#3a3935">रास्ते के पास ज़्यादा निशान</text>
<text x="46" y="368" font-size="9" fill="#7c7c80">समूह सभी दिनों के तीन बराबर हिस्से हैं, हवा के 48 घंटे के रास्ते से 25 किमी के भीतर, हवा के गुज़रने के समय के आसपास के MODIS निशानों की संख्या के हिसाब से।</text>
<text x="46" y="380" font-size="9" fill="#7c7c80">यह दिनों के समूहों की आपस में तुलना है। इससे यह नहीं नापा जाता कि प्रदूषण का कितना हिस्सा आग से आया। हमारी हवा।</text></svg>