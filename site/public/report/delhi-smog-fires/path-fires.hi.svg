<text x="46" y="18" font-size="14" font-weight="700" fill="#1d1d1b">दिल्ली का PM2.5, आने वाली हवा के रास्ते के पास आग के निशानों के हिसाब से, µg/m³</text>
<text x="46" y="33" font-size="10.5" fill="#7c7c80">रोज़ाना शहर के आंकड़ों की माध्यिका, 161 दिन (15 अक्टूबर–30 नवंबर; 2016–2021, 2025 और 2026), सीज़न के हर हिस्से में अलग</text>
