<rect x="446" y="338" width="10" height="10" fill="#d62d20" rx="2"/><text x="461" y="347" font-size="10" fill="#3a3935">Many detections near the path</text>
<text x="46" y="368" font-size="9" fill="#7c7c80">Categories are thirds of all days by the number of MODIS detections within 25 km of the 48-hour back-path, around the time the air passed.</text>
<text x="46" y="380" font-size="9" fill="#7c7c80">An association between groups of days. It does not measure how much of the pollution came from fires. HamariHawa.</text></svg>