<text x="46" y="368" font-size="9" fill="#7c7c80">⁧گروپ تمام دنوں کے تین برابر حصے ہیں، ہوا کے 48 گھنٹے کے راستے سے 25 کلومیٹر کے اندر، ہوا کے گزرنے کے وقت کے آس پاس کے MODIS مقامات کی تعداد کے لحاظ سے۔⁩</text>
<text x="46" y="380" font-size="9" fill="#7c7c80">⁧یہ دنوں کے گروپوں کا آپس میں موازنہ ہے۔ اس سے یہ نہیں ناپا جاتا کہ آلودگی کا کتنا حصہ آگ سے آیا۔ ہماری ہوا۔⁩</text></svg>