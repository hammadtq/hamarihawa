<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" font-family="'Noto Naskh Arabic', 'Geeza Pro', Tahoma, Arial, sans-serif" role="img" aria-label="⁧موسم کے ہر حصے میں، ہوا کے راستے میں آگ کے مقامات کے گروپ کے لحاظ سے دہلی کا PM2.5⁩">
