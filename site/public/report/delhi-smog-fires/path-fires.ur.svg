<text x="46" y="18" font-size="14" font-weight="700" fill="#1d1d1b">⁧دہلی کا PM2.5، آنے والی ہوا کے راستے کے قریب آگ کے مقامات کے لحاظ سے، µg/m³⁩</text>
<text x="46" y="33" font-size="10.5" fill="#7c7c80">⁧روزانہ شہری اعداد کا وسطانیہ، 161 دن (15 اکتوبر–30 نومبر؛ 2016–2021، 2025 اور 2026)، موسم کے ہر حصے میں الگ⁩</text>
