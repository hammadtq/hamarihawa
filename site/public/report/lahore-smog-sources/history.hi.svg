<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', Mangal, Nirmala UI, Arial, sans-serif" role="img" aria-label="चार्ट: अमृतसर में हर दशक में सर्दियों के बेहद कम दृश्यता वाले दिन, और पंजाब में MODIS के आग के निशानों का कितना हिस्सा नवंबर में दर्ज हुआ, 2002 से 2025">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="22" font-size="14" font-weight="700" fill="#1d1d1b">सर्दियों में बेहद कम दृश्यता वाले दिन</text>
<text x="20" y="38" font-size="10.5" fill="#55534e">दिसंबर–जनवरी के कितने दिन दृश्यता 1 km से कम रही,</text><text x="20" y="52" font-size="10.5" fill="#55534e">अमृतसर हवाई अड्डा, लाहौर से लगभग 47 km; बिना सुधार के</text>
<line x1="40" x2="340" y1="300.0" y2="300.0" stroke="#eee"/><text x="35" y="303.0" font-size="9.5" text-anchor="end" fill="#7c7c80">0%</text>
<line x1="40" x2="340" y1="248.9" y2="248.9" stroke="#eee"/><text x="35" y="251.9" font-size="9.5" text-anchor="end" fill="#7c7c80">10%</text>
<line x1="40" x2="340" y1="197.8" y2="197.8" stroke="#eee"/><text x="35" y="200.8" font-size="9.5" text-anchor="end" fill="#7c7c80">20%</text>
<line x1="40" x2="340" y1="146.7" y2="146.7" stroke="#eee"/><text x="35" y="149.7" font-size="9.5" text-anchor="end" fill="#7c7c80">30%</text>
<line x1="40" x2="340" y1="95.6" y2="95.6" stroke="#eee"/><text x="35" y="98.6" font-size="9.5" text-anchor="end" fill="#7c7c80">40%</text>
<rect x="46.0" y="295.9" width="38.0" height="4.1" fill="#7d8ea0" rx="2"/>
<text x="65.0" y="291.9" font-size="10" text-anchor="middle" fill="#1d1d1b">0.8%</text><text x="65.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">1970 दशक</text>
<rect x="96.0" y="277.5" width="38.0" height="22.5" fill="#7d8ea0" rx="2"/>
<text x="115.0" y="273.5" font-size="10" text-anchor="middle" fill="#1d1d1b">4.4%</text><text x="115.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">1980 दशक</text>
<rect x="146.0" y="247.4" width="38.0" height="52.6" fill="#7d8ea0" rx="2"/>
<text x="165.0" y="243.4" font-size="10" text-anchor="middle" fill="#1d1d1b">10.3%</text><text x="165.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">1990 दशक</text>
<rect x="196.0" y="229.0" width="38.0" height="71.0" fill="#7d8ea0" rx="2"/>
<text x="215.0" y="225.0" font-size="10" text-anchor="middle" fill="#1d1d1b">13.9%</text><text x="215.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2000 दशक</text>
<rect x="246.0" y="197.8" width="38.0" height="102.2" fill="#7d8ea0" rx="2"/>
<text x="265.0" y="193.8" font-size="10" text-anchor="middle" fill="#1d1d1b">20%</text><text x="265.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2010 दशक</text>
<rect x="296.0" y="89.9" width="38.0" height="210.1" fill="#7d8ea0" rx="2"/>
<text x="315.0" y="85.9" font-size="10" text-anchor="middle" fill="#1d1d1b">41.1%</text><text x="315.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2020–24</text>
<text x="410" y="22" font-size="14" font-weight="700" fill="#1d1d1b">सैटेलाइटों को आग कब दिखती है</text>
<text x="410" y="38" font-size="10.5" fill="#55534e">अक्टूबर–नवंबर के MODIS के आग के निशानों का हिस्सा</text><text x="410" y="52" font-size="10.5" fill="#55534e">जो नवंबर में दर्ज हुआ; स्रोत के हिसाब से न बँटे, न दोहराव हटा</text>
<line x1="430" x2="740" y1="300.0" y2="300.0" stroke="#eee"/><text x="425" y="303.0" font-size="9.5" text-anchor="end" fill="#7c7c80">0%</text>
<line x1="430" x2="740" y1="242.5" y2="242.5" stroke="#eee"/><text x="425" y="245.5" font-size="9.5" text-anchor="end" fill="#7c7c80">25%</text>
<line x1="430" x2="740" y1="185.0" y2="185.0" stroke="#eee"/><text x="425" y="188.0" font-size="9.5" text-anchor="end" fill="#7c7c80">50%</text>
<line x1="430" x2="740" y1="127.5" y2="127.5" stroke="#eee"/><text x="425" y="130.5" font-size="9.5" text-anchor="end" fill="#7c7c80">75%</text>
<line x1="430" x2="740" y1="70.0" y2="70.0" stroke="#eee"/><text x="425" y="73.0" font-size="9.5" text-anchor="end" fill="#7c7c80">100%</text>
