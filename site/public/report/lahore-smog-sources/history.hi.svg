<text x="605.2" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2015</text>
<text x="672.6" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2020</text>
<text x="740.0" y="314" font-size="10" text-anchor="middle" fill="#3a3935">2025</text>
<line x1="524.3" x2="524.3" y1="70" y2="300" stroke="#999" stroke-dasharray="3 3"/><text x="528.3" y="292" font-size="9" fill="#55534e">2009: भारत में धान की रोपाई</text><text x="528.3" y="302" font-size="9" fill="#55534e" dy="-0">की तारीख़ें आगे बढ़ीं</text>
<text x="653.7" y="86.1" font-size="10.5" font-weight="700" fill="#d62d20">भारतीय पंजाब</text>
<text x="430.0" y="81.5" font-size="10.5" font-weight="700" fill="#1f6f8b">पाकिस्तानी पंजाब (उत्तर-पूर्व)</text>
<text x="20" y="340" font-size="9" fill="#7c7c80">दृश्यता: NOAA GSOD, अमृतसर (VIAR), रोज़ की औसत दृश्यता, बिना सुधार के; 1990 से पहले दिन में 5–7 रीडिंग, 2010 से 22–24। कोहरे और धुएँ में फ़र्क़ नहीं किया जा सकता।</text>
<text x="20" y="353" font-size="9" fill="#7c7c80">सर्दी = दिसंबर और अगली जनवरी, दिसंबर वाले साल में गिनी गई। आग: FIRMS MODIS (Terra, Aqua), type 0, कॉन्फ़िडेंस ≥30, 1 अक्टू–30 नवं,</text>
<text x="20" y="366" font-size="9" fill="#7c7c80">दोनों तरफ़ का पंजाब, 29.5–32.6 N, 72–76.9 E के भीतर; दोपहर में सैटेलाइट गुज़रने के बाद लगी आग छूट जाती है। HamariHawa (hamarihawa.org)</text>
</svg>