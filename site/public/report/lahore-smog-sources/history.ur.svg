<text x="653.7" y="86.1" font-size="10.5" font-weight="700" fill="#d62d20">⁧ہندوستانی پنجاب⁩</text>
<text x="430.0" y="81.5" font-size="10.5" font-weight="700" fill="#1f6f8b">⁧پاکستانی پنجاب (شمال مشرق)⁩</text>
<text x="20" y="340" font-size="9" fill="#7c7c80">⁧حدِ نگاہ: NOAA GSOD، امرتسر (VIAR)، روزانہ اوسط حدِ نگاہ، غیر ترمیم شدہ؛ 1990 سے پہلے دن میں 5–7 ریڈنگ، 2010 سے 22–24۔ دھند اور دھوئیں میں فرق نہیں کیا جا سکتا۔⁩</text>
<text x="20" y="353" font-size="9" fill="#7c7c80">⁧سردی = دسمبر اور اگلا جنوری، دسمبر کے سال کے تحت۔ آگ: FIRMS MODIS (Terra، Aqua)، قسم 0، اعتماد ≥30، 1 اکتوبر–30 نومبر،⁩</text>
<text x="20" y="366" font-size="9" fill="#7c7c80">⁧دونوں جانب کا پنجاب، 29.5–32.6 N، 72–76.9 E کے اندر؛ دوپہر کو سیٹلائٹ گزرنے کے بعد لگی آگ رہ جاتی ہے۔ ہماری ہوا (hamarihawa.org)⁩</text>
</svg>