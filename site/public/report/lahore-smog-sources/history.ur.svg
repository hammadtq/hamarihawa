<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Noto Naskh Arabic', 'Geeza Pro', Tahoma, Arial, sans-serif" role="img" aria-label="⁧چارٹ: امرتسر میں بہت کم حدِ نگاہ والے سردیوں کے دن، دہائی وار، اور پنجاب میں MODIS کی فعال آگ کی نشاندہیوں کا نومبر میں ریکارڈ ہونے والا حصہ، 2002 سے 2025⁩">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="22" font-size="14" font-weight="700" fill="#1d1d1b">⁧بہت کم حدِ نگاہ والے سردیوں کے دن⁩</text>
<text x="20" y="38" font-size="10.5" fill="#55534e">⁧دسمبر–جنوری کے دنوں میں 1 کلومیٹر سے کم حدِ نگاہ کا حصہ،⁩</text><text x="20" y="52" font-size="10.5" fill="#55534e">⁧امرتسر ہوائی اڈہ، لاہور سے تقریباً 47 کلومیٹر؛ غیر ترمیم شدہ؛ دہائی وار⁩</text>
