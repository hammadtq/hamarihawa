<text x="410" y="22" font-size="14" font-weight="700" fill="#1d1d1b">⁧سیٹلائٹ کو آگ کب نظر آتی ہے⁩</text>
<text x="410" y="38" font-size="10.5" fill="#55534e">⁧اکتوبر–نومبر کی MODIS فعال آگ کی نشاندہیوں میں سے⁩</text><text x="410" y="52" font-size="10.5" fill="#55534e">⁧نومبر کا حصہ؛ ذریعے کے لحاظ سے الگ نہیں، دہری گنتی نہیں نکالی⁩</text>
