<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', Mangal, 'Nirmala UI', Arial, sans-serif" role="img" aria-label="2023 से 2026 तक दोनों जगहों पर सैटेलाइट के हर फेरे का चार्ट। महमूद बूटी: 12 में से किसी फेरे में गुबार नहीं। लखोडेर: 11 में गुबार, जिनकी दर क़रीब 0.6 से 3.6 टन प्रति घंटा है।">
<rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="20" font-size="14" font-weight="700" fill="#1d1d1b">सैटेलाइट का हर फेरा: लखोडेर पर एक को छोड़ हर बार गुबार, महमूद बूटी पर कोई रिपोर्ट नहीं हुआ</text>
<text x="16" y="36" font-size="10.5" fill="#7c7c80">हर निशान एक फेरा है। लखोडेर की दर टन मीथेन प्रति घंटा में है; खड़ी रेखाएँ अनिश्चितता दिखाती हैं, जो एक से ज़्यादा गुबार वाले फेरों के लिए हमने ख़ुद मिलाई है</text>
